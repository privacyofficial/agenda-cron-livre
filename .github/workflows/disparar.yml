name: Agenda

# Repositorio PUBLICO de proposito (minutos ilimitados e gratis).
# Aqui NAO tem video nem dado nenhum.
#
# O agendador (schedule) do GitHub esta dessincronizado nesta conta: ele
# dispara o workflow na hora errada ou nao dispara. Por isso este workflow
# e um VIGIA: ele roda direto na nuvem, olha o relogio a cada 45 segundos
# e da a ordem de postar exatamente no horario certo, sem depender do PC.
# No fim do tempo dele ele se dispara de novo para continuar a correnha.
on:
  schedule:
    # 06:00 de Brasilia (UTC-3) = 09:00 UTC
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    # 23:00 de Brasilia (UTC-3) = 02:00 UTC
    - cron: '0 2 * * *'
    - cron: '30 2 * * *'
    - cron: '0 3 * * *'
    # rodadas de manutencao (procura atraso de qualquer horario)
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions: {}

# So UM vigia por vez: o mais novo cancela o antigo. Sem isto a corrente e o
# proprio schedule iam acumular varios vigias rodando e cada um disparava o
# postar de novo no mesmo horario.
concurrency:
  group: vigia-agenda
  cancel-in-progress: true

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Vigiar o relogio e dar a ordem
        env:
          TOKEN: ${{ secrets.ALVO_TOKEN }}
          ALVO: ${{ secrets.ALVO_REPO }}
        shell: bash
        run: |
          set -u
          API="https://api.github.com/repos/${ALVO}"
          MINHA_API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          JANELA=90

          pegar() {
            # o GitHub devolve o arquivo com BOM (EF BB BF) e o jq nao le JSON
            # com BOM - por isso tiramos o BOM antes de qualquer coisa.
            local c
            c=$(curl -sfL --max-time 25 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$1" | jq -r '.content' | base64 -d 2>/dev/null)
            c="${c#$'\xef\xbb\xbf'}"
            printf '%s' "$c"
          }

          mins() { # 04:00 -> 240
            echo $(( 10#${1%%:*} * 60 + 10#${1##*:} ))
          }

          cfg=$(pegar "${API}/contents/config-base.json")
          horarios=$(printf '%s' "${cfg}" | jq -r '.horarios[]?' 2>/dev/null)
          if [ -z "${horarios}" ]; then
            echo "NAO consegui ler os horarios - vou conferir a cada tentativa"
          fi

          inicio=$(date +%s)
          limite=$(( inicio + 325 * 60 ))
          ultimo_disparo=0
          ultimo_aviso=0

          echo "vigia ligado: janela de ${JANELA} min, horarios=$(echo ${horarios} | tr '\n' ' ')"

          while [ "$(date +%s)" -lt "${limite}" ]; do
            hoje=$(TZ='Etc/GMT+3' date +%F)
            agora=$(TZ='Etc/GMT+3' date +%H:%M)
            agora_m=$(( 10#${agora%%:*} * 60 + 10#${agora##*:} ))

            if [ -z "${horarios}" ]; then
              cfg=$(pegar "${API}/contents/config-base.json")
              horarios=$(printf '%s' "${cfg}" | jq -r '.horarios[]?' 2>/dev/null)
            fi

            sl=$(pegar "${API}/contents/slots.json")
            dia=$(printf '%s' "${sl}" | jq -r '.dia // ""' 2>/dev/null)
            postados=$(printf '%s' "${sl}" | jq -r '(.slots // []) | join(",")' 2>/dev/null)

            deve=0
            qual=""
            for h in ${horarios}; do
              hm=$(mins "${h}")
              if [ "${agora_m}" -ge "${hm}" ] && [ "${agora_m}" -le $((hm + JANELA)) ]; then
                if [ "${dia}" != "${hoje}" ] || ! printf ',%s,' "${postados}" | grep -qF ",${h},"; then
                  deve=1
                  qual="${h}"
                  break
                fi
              fi
            done

            agora_s=$(date +%s)
            if [ "${deve}" -eq 1 ] && [ $((agora_s - ultimo_disparo)) -gt 300 ]; then
              echo "ORDENANDO postar as ${qual} (${agora} local)"
              code=$(curl -sL --post301 --post302 --post303 -o resp.txt -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${API}/actions/workflows/postar.yml/dispatches" \
                -d '{"ref":"master"}')
              echo "ordem HTTP ${code}"
              [ "${code}" = "204" ] || cat resp.txt
              ultimo_disparo="${agora_s}"
            elif [ $((agora_s - ultimo_aviso)) -ge 600 ]; then
              echo "vigiando: ${agora} local, ultimo post=$(echo "${postados}" | tr ',' ' ')"
              ultimo_aviso="${agora_s}"
            fi

            sleep 45
          done

          echo "tempo do vigia acabando - passando a corrente"
          code=$(curl -sL --post301 --post302 --post303 -o resp2.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${MINHA_API}/actions/workflows/disparar.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
          echo "corrente HTTP ${code}"
          if [ "${code}" != "204" ]; then
            echo "FALHA ao passar a corrente"
            cat resp2.txt
            exit 1
          fi
